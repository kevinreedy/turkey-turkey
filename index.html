<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16120E">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Turkey Turkey">
  <meta name="robots" content="noindex">
  <title>Turkey Turkey</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <main id="view" class="view" tabindex="-1"></main>
    <nav class="tabs" aria-label="Sections">
      <button type="button" class="tab" data-action="tab" data-tab="match">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4v16M9.3 4v16M14.7 4v16M20 4v16"/></svg>Match
      </button>
      <button type="button" class="tab" data-action="tab" data-tab="people">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18.5 14.8c1.6.8 2.7 2.5 3 5.2"/></svg>People
      </button>
      <button type="button" class="tab" data-action="tab" data-tab="settle">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>Settle
      </button>
      <button type="button" class="tab" data-action="tab" data-tab="setup">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Setup
      </button>
    </nav>
  </div>
  <div id="sheet"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input id="restore-file" type="file" accept="application/json,.json" hidden>
  <noscript><p style="padding:24px">Turkey Turkey needs JavaScript.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
